name: Publish

on:
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3
      - id: version
        run: bun -e 'import { appendFileSync } from "node:fs"; import { releaseVersion } from "./scripts/release.mjs"; import pkg from "./package.json"; appendFileSync(process.env.GITHUB_OUTPUT, `version=${releaseVersion(pkg)}\n`);'

  check:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Release v${{ needs.version.outputs.version }}
    needs: [check, version]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://github.com/0xjimmy/ether-state/releases/tag/v${{ needs.version.outputs.version }}
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.11.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: bun run test:package
      - name: Validate version and publish package
        run: bun scripts/publish.mjs
      - name: Create GitHub Release and publish GitHub package
        run: bun scripts/publish-github.mjs
        env:
          GH_TOKEN: ${{ github.token }}
